# ─────────────────────────────────────────────────────────────────────────────
# VALIDATION PIPELINE — MSP Observability Platform
# ─────────────────────────────────────────────────────────────────────────────
# Purpose  : Validates code quality, infrastructure and security on every PR
# Trigger  : Pull requests to main and direct pushes to main
# Author   : Daniel Melo
# Docs     : docs/SECURITY.md
# ─────────────────────────────────────────────────────────────────────────────
#
# Pipeline flow:
#   [1] terraform-validate  → Syntax and format validation
#   [2] kubernetes-validate → Dry-run all K8s manifests
#   [3] python-lint         → Code quality with flake8
#   [4] docker-build        → Build all images locally
#   [5] checkov-scan        → IaC security scan (BLOCKS on CRITICAL)
#   [6] trivy-scan          → Vulnerability scan (BLOCKS on CRITICAL)
#   [7] owasp-zap-scan      → DAST scan against FastAPI (informational)
#   [8] security-gate       → Final summary — pass or fail
#
# Security philosophy:
#   - SAST (static analysis) blocks the pipeline on critical findings
#   - DAST (dynamic analysis) is informational at this stage
#   - All reports saved as artifacts for audit trail
# ─────────────────────────────────────────────────────────────────────────────

name: Validate Infrastructure and Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:

  # ───────────────────────────────────────────────────────────
  # JOB 1 — TERRAFORM VALIDATION
  # ───────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0

    - name: Terraform Format Check
      run: |
        cd terraform/environments/dev
        terraform fmt -check -recursive

    - name: Terraform Init
      run: |
        cd terraform/environments/dev
        terraform init -backend=false

    - name: Terraform Validate
      run: |
        cd terraform/environments/dev
        terraform validate

  # ───────────────────────────────────────────────────────────
  # JOB 2 — KUBERNETES MANIFESTS VALIDATION
  # ───────────────────────────────────────────────────────────
  # Validates YAML syntax of all Kubernetes manifests using
  # kubeval — works without a live cluster connection.
  # kubeval checks manifests against official K8s JSON schemas.
  # ───────────────────────────────────────────────────────────
  kubernetes-validate:
    name: Kubernetes Manifests Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install kubeval
      run: |
        wget -q https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
        tar xf kubeval-linux-amd64.tar.gz
        sudo mv kubeval /usr/local/bin/

    - name: Validate all Kubernetes manifests
      run: |
        kubeval --strict           --ignore-missing-schemas           k8s/zabbix/*.yaml           k8s/cliente-a/*.yaml           k8s/cliente-b/*.yaml           k8s/cliente-c/*.yaml           k8s/monitoring/*.yaml

  # ───────────────────────────────────────────────────────────
  # JOB 3 — PYTHON CODE QUALITY
  # ───────────────────────────────────────────────────────────
  python-lint:
    name: Python Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install flake8 pylint

    - name: Lint Python code
      run: |
        flake8 app/ zabbix-config/automation/ \
          --max-line-length=120 \
          --ignore=E501,W503
      continue-on-error: true

  # ───────────────────────────────────────────────────────────
  # JOB 4 — DOCKER BUILD TEST
  # ───────────────────────────────────────────────────────────
  # Validates all Dockerfiles build successfully
  # Images are not pushed here — push happens in build-and-push.yaml
  # ───────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build base-api image
      run: |
        docker build -t base-api:test \
          -f app/base-api/Dockerfile app/

    - name: Build webhook-handler image
      run: |
        docker build -t webhook-handler:test \
          -f zabbix-config/automation/Dockerfile zabbix-config/automation/

    - name: Build load-generator image
      run: |
        docker build -t load-generator:test \
          -f app/load-generator/Dockerfile app/load-generator/

  # ───────────────────────────────────────────────────────────
  # JOB 5 — IaC SECURITY SCAN (CHECKOV)
  # ───────────────────────────────────────────────────────────
  # Scans all Terraform files for security misconfigurations
  # Examples of what Checkov catches:
  #   - S3 buckets without encryption
  #   - Security groups with 0.0.0.0/0 ingress
  #   - IAM roles with excessive permissions
  #   - EKS clusters without logging enabled
  #
  # soft_fail: false = pipeline BLOCKS on any finding
  # ───────────────────────────────────────────────────────────
  checkov-scan:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Checkov on Terraform
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform/
        framework: terraform
        soft_fail: false
        output_format: cli
        output_file_path: checkov-report.txt

    - name: Upload Checkov report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: checkov-report
        path: checkov-report.txt
        retention-days: 30

  # ───────────────────────────────────────────────────────────
  # JOB 6 — VULNERABILITY SCAN (TRIVY)
  # ───────────────────────────────────────────────────────────
  # Scans filesystem and dependencies for known CVEs
  # Uses Trivy CLI directly for full control over output
  # exit-code 1 blocks pipeline on CRITICAL,HIGH findings
  # ───────────────────────────────────────────────────────────
  trivy-scan:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

    - name: Run Trivy filesystem scan
      run: |
        trivy fs .           --severity CRITICAL,HIGH           --format table           --exit-code 1
      continue-on-error: false

    - name: Generate SARIF report for GitHub Security
      if: always()
      run: |
        trivy fs .           --severity CRITICAL,HIGH           --format sarif           --output trivy-results.sarif           --exit-code 0

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

    - name: Upload Trivy report as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-report
        path: trivy-results.sarif
        retention-days: 30

  # ───────────────────────────────────────────────────────────
  # JOB 7 — DAST SCAN (OWASP ZAP)
  # ───────────────────────────────────────────────────────────
  # Dynamic Application Security Testing — simulates an attacker
  # trying to exploit the running FastAPI application
  #
  # What ZAP tests:
  #   - SQL Injection attempts
  #   - Cross-Site Scripting (XSS)
  #   - Security headers missing
  #   - Authentication bypass attempts
  #   - Sensitive data exposure
  #
  # continue-on-error: true because DAST is informational
  # at this stage. Review ZAP report artifacts after each run.
  # ───────────────────────────────────────────────────────────
  owasp-zap-scan:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start test application for DAST scan
      run: |
        # Start a simple HTTP server for ZAP to scan
        # Full app requires database — use minimal server for DAST demo
        python3 -m http.server 8000 &
        sleep 5
        curl -f http://localhost:8000 || exit 1

    - name: Run OWASP ZAP baseline scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: http://localhost:8000
        report_html: zap-report.html
        report_json: zap-report.json
        fail_action: false
      continue-on-error: true

    - name: Upload ZAP report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-report
        path: |
          zap-report.html
          zap-report.json
        retention-days: 30

  # ───────────────────────────────────────────────────────────
  # JOB 8 — SECURITY GATE
  # ───────────────────────────────────────────────────────────
  # Final job that summarizes all security findings.
  # Runs after all security scans complete.
  # Fails if any blocking scan (Checkov or Trivy) failed.
  #
  # This is the single decision point:
  #   ✅ All scans passed → pipeline green → ready to deploy
  #   ❌ Any critical finding → pipeline red → fix before deploy
  # ───────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [checkov-scan, trivy-scan, owasp-zap-scan]
    if: always()

    steps:
    - name: Evaluate security gate
      run: |
        echo "## Security Gate Results" >> $GITHUB_STEP_SUMMARY
        echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Checkov (IaC) | ${{ needs.checkov-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Trivy (CVE) | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| OWASP ZAP (DAST) | ${{ needs.owasp-zap-scan.result }} (informational) |" >> $GITHUB_STEP_SUMMARY

        CHECKOV="${{ needs.checkov-scan.result }}"
        TRIVY="${{ needs.trivy-scan.result }}"
        ZAP="${{ needs.owasp-zap-scan.result }}"

        if [[ "$CHECKOV" == "failure" || "$TRIVY" == "failure" ]]; then
          echo "### ❌ Security Gate FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Blocking scan failed — fix before deploying." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "### ✅ Security Gate PASSED" >> $GITHUB_STEP_SUMMARY
          echo "All blocking scans passed. Safe to proceed." >> $GITHUB_STEP_SUMMARY
          if [[ "$ZAP" == "failure" ]]; then
            echo "> ⚠️ OWASP ZAP failed (informational only — review zap-report artifact)" >> $GITHUB_STEP_SUMMARY
          fi
        fi
