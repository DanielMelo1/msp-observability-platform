# ─────────────────────────────────────────────────────────────────────────────
# BUILD AND PUSH PIPELINE — MSP Observability Platform
# ─────────────────────────────────────────────────────────────────────────────
# Purpose  : Builds Docker images, scans for vulnerabilities, pushes to ECR
# Trigger  : Push to main branch or version tags
# Security : OIDC authentication — no static AWS credentials
# Registry : Amazon ECR (AWS native — replaces GHCR)
# Author   : Daniel Melo
# Docs     : docs/SECURITY.md
# ─────────────────────────────────────────────────────────────────────────────
#
# Pipeline flow per image:
#   [1] Build Docker image locally
#   [2] Scan image with Trivy (BLOCKS on CRITICAL vulnerabilities)
#   [3] Push to ECR only if scan passed
#
# Why ECR instead of GHCR:
#   - Native AWS integration with IAM access control
#   - Images stay inside the AWS ecosystem
#   - Automatic vulnerability scanning via Amazon Inspector
#   - No separate registry credentials needed (OIDC handles auth)
#
# Required AWS pre-configuration:
#   - ECR repositories created for each image
#   - IAM Role with ECR push permissions
#   - OIDC provider configured for github.com
#   - See docs/SECURITY.md#ecr-setup for setup guide
# ─────────────────────────────────────────────────────────────────────────────

name: Build and Push to ECR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 509399596610
  ECR_REGISTRY: 509399596610.dkr.ecr.us-east-1.amazonaws.com
  PROJECT_PREFIX: msp-observability

jobs:

  # ───────────────────────────────────────────────────────────
  # JOB 1 — BUILD AND PUSH BASE API
  # ───────────────────────────────────────────────────────────
  # FastAPI application serving all three simulated clients
  # Trivy scans the built image before pushing to ECR
  # If CRITICAL CVE found — push is blocked automatically
  # ───────────────────────────────────────────────────────────
  build-base-api:
    name: Build Base API
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC token request
      contents: read
      security-events: write  # Required for uploading SARIF results

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # OIDC: temporary credentials — no static keys stored anywhere
        role-to-assume: arn:aws:iam::509399596610:role/github-actions-deploy-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata for tagging
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_PREFIX }}/base-api
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build image locally for scanning
      uses: docker/build-push-action@v5
      with:
        context: app/
        file: app/base-api/Dockerfile
        # load: true builds locally without pushing — scan happens first
        load: true
        tags: base-api:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image with Trivy before push
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: base-api:scan
        format: sarif
        output: trivy-base-api.sarif
        # exit-code 1 blocks the push if CRITICAL CVE found
        # Image never reaches ECR if it fails here
        exit-code: '1'
        severity: CRITICAL

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-base-api.sarif
        category: trivy-base-api

    - name: Push to ECR (only if Trivy passed)
      uses: docker/build-push-action@v5
      with:
        context: app/
        file: app/base-api/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────
  # JOB 2 — BUILD AND PUSH WEBHOOK HANDLER
  # ───────────────────────────────────────────────────────────
  # Python service that receives Zabbix alerts and triggers
  # auto-scaling actions on the EKS cluster
  # ───────────────────────────────────────────────────────────
  build-webhook-handler:
    name: Build Webhook Handler
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::509399596610:role/github-actions-deploy-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata for tagging
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_PREFIX }}/webhook-handler
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha

    - name: Build image locally for scanning
      uses: docker/build-push-action@v5
      with:
        context: zabbix-config/automation/
        file: zabbix-config/automation/Dockerfile
        load: true
        tags: webhook-handler:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image with Trivy before push
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: webhook-handler:scan
        format: sarif
        output: trivy-webhook-handler.sarif
        exit-code: '1'
        severity: CRITICAL

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-webhook-handler.sarif
        category: trivy-webhook-handler

    - name: Push to ECR (only if Trivy passed)
      uses: docker/build-push-action@v5
      with:
        context: zabbix-config/automation/
        file: zabbix-config/automation/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────
  # JOB 3 — BUILD AND PUSH LOAD GENERATOR
  # ───────────────────────────────────────────────────────────
  # Locust-based load generator used to simulate traffic
  # for each client and demonstrate auto-scaling behavior
  # ───────────────────────────────────────────────────────────
  build-load-generator:
    name: Build Load Generator
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::509399596610:role/github-actions-deploy-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata for tagging
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT_PREFIX }}/load-generator
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha

    - name: Build image locally for scanning
      uses: docker/build-push-action@v5
      with:
        context: app/load-generator/
        file: app/load-generator/Dockerfile
        load: true
        tags: load-generator:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image with Trivy before push
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: load-generator:scan
        format: sarif
        output: trivy-load-generator.sarif
        exit-code: '1'
        severity: CRITICAL

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-load-generator.sarif
        category: trivy-load-generator

    - name: Push to ECR (only if Trivy passed)
      uses: docker/build-push-action@v5
      with:
        context: app/load-generator/
        file: app/load-generator/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
